# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - project-gnosis-api

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_92E10AFBA9534172B5C196266218D60D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_388FDE0FB53A4E3A9777E2F767CB8BC1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3617214ECC424E0F82E336431E59B8A1 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'project-gnosis-api'
          slot-name: 'Production'

      - name: Wait for container startup and verify health
        # Azure App Service extracts the tarball (~3 min) then boots gunicorn
        # before the health endpoint becomes reachable. We wait 240s to cover
        # that window, then probe /health with retries.
        # If the API does not come up healthy, the workflow fails here —
        # surfacing a broken deployment in GitHub instead of silently serving
        # 502s to the frontend.
        run: |
          echo "Waiting 240s for container extraction and gunicorn startup..."
          sleep 240
          echo "Probing health endpoint..."
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-delay 15 \
            --retry-connrefused \
            https://project-gnosis-api-chfxhsa2b4ajfvag.eastasia-01.azurewebsites.net/health
          echo ""
          echo "Deployment healthy — container is up and accepting requests."